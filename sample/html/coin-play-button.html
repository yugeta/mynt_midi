<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MYNT MIDI API Sample - Coin</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --text: #14202b;
        --muted: #5f6c79;
        --primary: #0d6efd;
        --primary-hover: #0b5ed7;
        --danger: #d63384;
        --danger-hover: #b62c6f;
        --border: #d7dee7;
      }

      body {
        margin: 0;
        font-family: "Helvetica Neue", "Yu Gothic", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 12% 20%, #deedff 0%, transparent 40%),
          radial-gradient(circle at 80% 15%, #e8fff6 0%, transparent 35%),
          var(--bg);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .panel {
        width: min(92vw, 560px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 12px 32px rgba(20, 32, 43, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.55;
      }

      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      button {
        border: 0;
        border-radius: 10px;
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        padding: 11px 18px;
        cursor: pointer;
      }

      #play-btn {
        background: var(--primary);
      }

      #play-btn:hover {
        background: var(--primary-hover);
      }

      #stop-btn {
        background: var(--danger);
      }

      #stop-btn:hover {
        background: var(--danger-hover);
      }

      #status {
        margin: 0;
        font-size: 0.95rem;
        color: var(--text);
      }

      code {
        background: #f0f4f8;
        border-radius: 6px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Coin Sound Playback Sample</h1>
      <p>
        <code>sample/コイン.json</code> を読み込み、ボタンクリックで
        <code>MyntMidi.playJson()</code> で再生します。
      </p>

      <div class="row">
        <button id="play-btn" type="button">Play Coin</button>
        <button id="stop-btn" type="button">Stop</button>
      </div>

      <p id="status">Status: idle</p>
    </main>

    <script type="module">
      import "../../src/js/api/mynt-api.js";

      const playBtn = document.getElementById("play-btn");
      const stopBtn = document.getElementById("stop-btn");
      const statusEl = document.getElementById("status");

      const COIN_JSON_PATH = "../コイン.json";

      let coinJsonCache = null;

      function setStatus(message) {
        statusEl.textContent = `Status: ${message}`;
      }

      async function loadCoinJson() {
        if (coinJsonCache) {
          return coinJsonCache;
        }

        const response = await fetch(COIN_JSON_PATH);
        if (!response.ok) {
          throw new Error(`JSON load failed: ${response.status} ${response.statusText}`);
        }

        coinJsonCache = await response.json();
        return coinJsonCache;
      }

      playBtn.addEventListener("click", async () => {
        try {
          setStatus("loading json...");

          const coinJson = await loadCoinJson();
          const handle = await window.MyntMidi.playJson(coinJson);

          setStatus(`playing (loop: ${handle.looping ? "on" : "off"})`);
        } catch (error) {
          setStatus(`error - ${error.message || "unknown error"}`);
          console.error(error);
        }
      });

      stopBtn.addEventListener("click", () => {
        window.MyntMidi.stop();
        setStatus("stopped");
      });
    </script>
  </body>
</html>
