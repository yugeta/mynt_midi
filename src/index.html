<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="favicon.ico" rel="icon" type="image/x-icon">
  <link href="favicon.ico" rel="apple-touch-icon" type="image/x-icon">
  <title>MYNT-midi</title>
  <link rel='stylesheet' href='css/style.css' />
  <script type='module' src='js/main.js'></script>
</head>
<body>
  <nav class="menubar no-select">
    <div class="menu-item">
      <img class="menu-logo" src="favicon.png" alt="MYNT" />
    </div>
    <div class="menu-item" data-menu="file">
      <span class="menu-label">ファイル</span>
      <ul class="menu-dropdown">
        <li data-action="new">新規作成</li>
        <li data-action="open">開く</li>
        <li class="menu-separator"></li>
        <li data-action="save">保存</li>
        <li data-action="save-as">名前を付けて保存</li>
        <li class="menu-separator"></li>
        <li data-action="json-import">JSON インポート</li>
        <li data-action="json-export">JSON エクスポート</li>
      </ul>
    </div>
    <div class="menu-item" data-menu="layer">
      <span class="menu-label">レイヤー</span>
      <ul class="menu-dropdown">
        <li data-action="layer-add">レイヤー追加</li>
        <li data-action="layer-duplicate">レイヤー複製</li>
        <li data-action="layer-delete">レイヤー削除</li>
        <li class="menu-separator"></li>
        <li data-action="layer-up">レイヤーを上へ</li>
        <li data-action="layer-down">レイヤーを下へ</li>
      </ul>
    </div>
    <div class="menu-item" data-menu="help">
      <span class="menu-label">ヘルプ</span>
      <ul class="menu-dropdown">
        <li data-action="about">MYNT MIDI について</li>
        <li data-action="shortcuts">ショートカット一覧</li>
        <li class="menu-separator"></li>
        <li data-action="docs">ドキュメント</li>
      </ul>
    </div>
    <span class="menubar-title">MYNT MIDI</span>
  </nav>

  <!-- レイヤー + MIDI文字列エリア（横並び） -->
  <div class='workspace-area'>
    <div class='midi-string-area'>
      <div class='midi-string-header'>
        <span class='midi-string-title'>Midi Code</span>
        <div class='midi-string-toolbar'>
          <button class='json-import-btn' title='JSON Import'>&#x2B07; Import</button>
          <button class='json-export-btn' title='JSON Export'>&#x2B06; Export</button>
        </div>
      </div>
      <textarea name='midi-string'></textarea>
      <!-- <textarea name='midi-string'>T4000 [O5fO6fO7f][O2cO3cO4c][O4eO5eO6e][O3bO4bO5b] T300S T4000 [O5fO6fO7f][O2cO3cO4c][O4eO5eO6e][O3bO4bO5b] T300S T4000 [O5fO6fO7f][O2cO3cO4c][O4eO5eO6e][O3bO4bO5b] T300S T4000 [O5fO6fO7f][O2cO3cO4c][O4eO5eO6e][O3bO4bO5b] T300S</textarea> -->
    </div>
  </div>

  <!-- トランスポートバー（Time + 再生コントロール） -->
  <div class='transport-bar no-select'>
    <div class='transport-left'>
      <div class='input-group' name='time'>
        <span class='input-label'>Time</span>
        <input type='number' step='0.1' name='time'/>
        <span class='input-unit'>sec</span>
      </div>
    </div>
    <div class='transport-center' name='play'>
      <div class='start'><svg src='img/icon/start.svg'></svg></div>
      <input type='text' name='mmdd' placeholder='00.000'/>
      <div class='play'><svg src='img/icon/play.svg'></svg></div>
      <div class='loop'><svg src='img/icon/loop.svg'></svg></div>
    </div>
    <div class='transport-right'>
      <button class='trim-btn' title='Trim — MIDI再生時間にTimeをフィット'>✂ Trim</button>
    </div>
  </div>

  <!-- 非表示: レイヤーパネルのオシレータ用（後方互換） -->
  <select name='oscillator_type' style='display:none'>
    <option name='sine'>sine</option>
    <option name='square' selected>square</option>
    <option name='sawtooth'>sawtooth</option>
    <option name='triangle'>triangle</option>
  </select>

  <div class='midi-frame no-select' data-type='timeline'>
    <div class='keyboard-head'></div>
    <div class='timeline'>
      <div class='timebar-scroll'>
        <svg class='timebar' src='img/icon/timebar.svg'></svg>
      </div>
    </div>
  </div>
  <div class='midi-frame no-select' data-type='editor'>
    <div class='keyboard'></div>
    <div class='editor'></div>
  </div>
  
</body>
</html>
